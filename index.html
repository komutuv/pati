<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#132c28">
  <title>Pati uygulamasını indir</title>
  <meta name="description" content="Pati uygulamasını telefonuna uygun mağazadan indir.">
  <style>
    :root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17352f;background:#f3f8f5}
    *{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px}
    main{width:min(100%,460px);padding:42px 28px;text-align:center;background:#fff;border:1px solid #e2eee7;border-radius:28px;box-shadow:0 18px 55px #17352f14}
    .mark{display:grid;place-items:center;width:74px;height:74px;margin:0 auto 20px;border-radius:22px;background:#dcefe3;font-size:36px}
    h1{margin:0;font-size:30px;letter-spacing:-.04em}p{line-height:1.55;color:#61736b;margin:12px 0 26px}
    .links{display:grid;gap:11px}a{display:block;padding:15px 18px;border-radius:13px;background:#17684d;color:white;text-decoration:none;font-weight:700}a + a{background:#edf5ef;color:#184b38}a:focus-visible{outline:3px solid #edb856;outline-offset:3px}
    small{display:block;margin-top:23px;color:#768a80;line-height:1.5}
  </style>
  <script>
    const stores = {
      android: 'https://play.google.com/store/apps/details?id=com.pati.mobile&pcampaignid=web_share',
      ios: 'https://apps.apple.com/tr/app/pati-evcil-hayvan-bak%C4%B1m%C4%B1/id6782953685?l=tr'
    };
    const ua = navigator.userAgent || '';
    const isAndroid = /Android/i.test(ua);
    const isIOS = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    const destination = isAndroid ? stores.android : isIOS ? stores.ios : null;
    if (destination) window.location.replace(destination);
    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('android').href = stores.android;
      document.getElementById('ios').href = stores.ios;
      if (destination) document.getElementById('status').textContent = 'Uygulama mağazasına yönlendiriliyorsun. Açılmazsa aşağıdaki bağlantıyı kullan.';
    });
  </script>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">🐾</div>
    <h1>Pati uygulamasını indir</h1>
    <p id="status">Telefonuna uygun mağazayı seçerek uygulamayı indirebilirsin.</p>
    <div class="links">
      <a id="android" href="https://play.google.com/store/apps/details?id=com.pati.mobile&amp;pcampaignid=web_share">Google Play’den indir</a>
      <a id="ios" href="https://apps.apple.com/tr/app/pati-evcil-hayvan-bak%C4%B1m%C4%B1/id6782953685?l=tr">App Store’dan indir</a>
    </div>
    <small>iPhone ve Android telefonlarda mağaza otomatik açılır.</small>
  </main>
</body>
</html>
